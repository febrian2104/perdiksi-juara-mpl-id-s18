repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format check
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
