[project]
name = "mpl-champion-predictor"
version = "0.1.0"
description = "Multi-season prediction pipeline and dashboard for MPL Indonesia."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mpl-predictor = "mpl_predictor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mpl_predictor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
